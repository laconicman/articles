name: Build and Deploy Jekyll Site

on:
  push:
    branches: [main]
  # Pull requests build but do not deploy, so a change to the build itself is checked
  # before it reaches main rather than after.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Built with bundler rather than actions/jekyll-build-pages: that action runs
      # Jekyll in safe mode against the GitHub Pages plugin allowlist, and
      # jekyll-polyglot is not on it — so the plugin never loaded and the site was
      # multilingual in configuration only.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production
          # index.md reads site.github.repository_url, which jekyll-github-metadata
          # resolves from this variable. actions/jekyll-build-pages set it for us;
          # a plain bundle exec build does not.
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
